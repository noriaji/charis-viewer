# Charis Viewer release builds (Windows 64-bit): the zip and the installer
# (Velopack's Setup.exe) from one build, in release-package.yml (its jobs build, bake
# and package; the shader bake, which runs Mesa, has a job of its own).
#
#   tag v*             after approval in the "release" environment: build, bake and package
#                      (read-only), then the publish job checks the assets, attests their
#                      provenance and makes a DRAFT release. Publishing the draft is done
#                      by hand.
#   workflow_dispatch  a test build: the same build, no release; the zip is kept as a
#                      workflow artifact for 3 days.
#
# Only the publish job can write (contents, attestations) and it runs nothing from the
# build: it takes the assets as an artifact and uses the gh, jq and sha256sum of the
# runner. Its checks (SHA256SUMS.txt against the SHA-256 the package job gave as a job
# output, the names, SHA256SUMS.txt made again, the feed) confirm that what the package
# job made arrived whole, not replaced, and has the expected form; they cannot tell a
# build that was tampered with from a good one (that is what the read-only build, the
# approval and the human look at the draft are for). No pull_request,
# pull_request_target or branch pushes: nothing runs for forks or for every commit.
# The only token is GITHUB_TOKEN; no secrets.
# Before the first run: BUILDING.md, "Release workflow" (pins, repository settings).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: charis-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate: the "release" environment requires the maintainer's approval (and is limited
  # to v* tags in the repository settings). The job also reads the environment's rules and
  # stops when no reviewer is required, so a gate that was never set up does not pass.
  approve:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      actions: read          # the environment's protection rules
    steps:
      - name: Approved, and the environment requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')
          if [ "${reviewers:-0}" -lt 1 ]; then
            echo "::error::the environment release requires no reviewer: set the maintainer as required reviewer (BUILDING.md, Release workflow)"
            exit 1
          fi
          echo "Release build approved for $GITHUB_REF_NAME ($reviewers required reviewer(s))"

  build:
    needs: approve
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/release-package.yml
    with:
      publish: true

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # the draft release and its assets
      id-token: write        # the provenance attestation (Sigstore)
      attestations: write
    env:
      BUILT_VERSION: ${{ needs.build.outputs.version }}
      BUILT_BUNDLE: ${{ needs.build.outputs.bundle }}
      # The build names its artifact (with its own run attempt), so re-running only this
      # job finds it.
      ARTIFACT: ${{ needs.build.outputs.artifact }}
      # The SHA-256 of the SHA256SUMS.txt the package job made, as its job output: no other
      # job can change it, so an artifact deleted and uploaded again (with a token taken
      # where Mesa ran) is refused below.
      BUILT_SUMS: ${{ needs.build.outputs.sums_sha256 }}
    steps:
      # The tag comes from the event, not from the build; the version is the tag without
      # "v" (the same form as TAG_RE in plus/building/release/releasecommon.py).
      - name: Tag, commit and version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          [[ "$GITHUB_REF" == "refs/tags/$tag" && "$tag" =~ $re ]] \
            || { echo "::error::$GITHUB_REF is not a release tag"; exit 1; }
          version="${tag#v}"
          [ "$version" = "$BUILT_VERSION" ] \
            || { echo "::error::the build says version $BUILT_VERSION, the tag $tag"; exit 1; }
          [[ "$ARTIFACT" =~ ^charis-release-[0-9]+-[0-9]+$ ]] \
            || { echo "::error::the build named its artifact $ARTIFACT"; exit 1; }
          default=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$default...$GITHUB_SHA" --jq '.status')
          case "$status" in
            identical|behind) ;;
            *) echo "::error::$GITHUB_SHA is not on $default ($status)"; exit 1 ;;
          esac
          printf '%s=%s\n' TAG "$tag" VERSION "$version" DIST "$RUNNER_TEMP/charis-dist" >> "$GITHUB_ENV"

      - name: Take the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/charis-dist

      # SHA256SUMS.txt is the one the package job made (its SHA-256 is that job's output);
      # exactly the expected regular files (no dot files, links or folders); SHA256SUMS.txt
      # made again here (the build's must agree: the transfer is whole); a feed with exactly
      # this release's one package, its Size and SHA-256 those of the file; the shader bundle
      # looked up in the zip itself.
      - name: Check the assets
        run: |
          set -euo pipefail
          cd "$DIST"
          v="$VERSION"
          [[ "$BUILT_SUMS" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the build gave no SHA-256 of SHA256SUMS.txt"; exit 1; }
          [ -f SHA256SUMS.txt ] || { echo "::error::missing asset SHA256SUMS.txt"; exit 1; }
          got=$(sha256sum < SHA256SUMS.txt | cut -d' ' -f1)
          [ "$got" = "$BUILT_SUMS" ] \
            || { echo "::error::SHA256SUMS.txt is not the one the package job made (SHA-256 $got, not $BUILT_SUMS)"; exit 1; }
          odd=$(find . -mindepth 1 \( ! -type f -o -name '.*' \) -print)
          [ -z "$odd" ] || { echo "::error::not plain files in the assets: $odd"; exit 1; }
          expected="CharisViewer-$v-win64-Setup.exe CharisViewer-$v-win64.zip CharisViewer-$v-win64-symbols.zip"
          expected="$expected CharisViewer-$v-src.zip CharisViewer-$v-build-record.txt releases.win.json SHA256SUMS.txt"
          for f in $expected; do [ -f "$f" ] || { echo "::error::missing asset $f"; exit 1; }; done
          package=""
          for f in *; do
            case " $expected " in *" $f "*) continue ;; esac
            if [[ -z "$package" && "$f" =~ ^CharisViewerApp-[0-9A-Za-z.+_-]+-full\.nupkg$ && "$f" != *..* ]]; then
              package="$f"; continue
            fi
            echo "::error::unexpected file in the assets: $f"; exit 1
          done
          [ -n "$package" ] || { echo "::error::no full package in the assets"; exit 1; }
          mv SHA256SUMS.txt "$RUNNER_TEMP/build-SHA256SUMS.txt"
          for f in *; do printf '%s  %s\n' "$(sha256sum < "$f" | cut -d' ' -f1)" "$f"; done > "$RUNNER_TEMP/SHA256SUMS.txt"
          diff <(sort "$RUNNER_TEMP/build-SHA256SUMS.txt") <(sort "$RUNNER_TEMP/SHA256SUMS.txt") \
            || { echo "::error::the assets are not the ones the build listed in SHA256SUMS.txt"; exit 1; }
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          prefix="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/"
          size=$(stat -c %s "$package")
          sha=$(sha256sum < "$package" | cut -d' ' -f1)
          jq -e --arg u "$prefix$package" --argjson n "$size" --arg s "$sha" \
            '(.Assets | length) == 1 and .Assets[0].FileName == $u and .Assets[0].Size == $n
             and (.Assets[0].SHA256 | ascii_downcase) == $s' releases.win.json > /dev/null \
            || { echo "::error::releases.win.json does not name exactly $prefix$package with its size and SHA-256"; exit 1; }
          if unzip -Z1 "CharisViewer-$v-win64.zip" | grep -qx "CharisViewer-$v-win64/app_settings/vk_shader_bundle/shaders.vkb"; then
            bundle=yes
          else
            bundle=no
          fi
          [ "$bundle" = "$BUILT_BUNDLE" ] \
            || { echo "::error::the build said shader bundle $BUILT_BUNDLE, the zip has $bundle"; exit 1; }
          printf '%s=%s\n' BUNDLE "$bundle" >> "$GITHUB_ENV"

      - name: Provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/charis-dist/*

      # The tag is checked again right before and right after the draft is made (it may have
      # been moved while the job ran); a draft made for a moved tag is deleted again.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$DIST"
          tag_names_built() {
            local ref sha
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
            if [ "${ref%% *}" = tag ]; then
              sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq '.object.sha')
            else
              sha="${ref#* }"
            fi
            [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::tag $TAG names $sha, not the built $GITHUB_SHA"; return 1; }
          }
          tag_names_built
          notes="$RUNNER_TEMP/release-notes.md"
          setup="CharisViewer-$VERSION-win64-Setup.exe"
          zip="CharisViewer-$VERSION-win64.zip"
          {
            echo "Charis Viewer $VERSION for Windows 64-bit (alpha). Draft made by the release workflow: check it before publishing."
            echo
            if [ "$BUNDLE" != yes ]; then
              echo "**No shader bundle in this build**: the first start compiles every shader (about a minute)."
              echo
            fi
            echo "- Installer (updates itself): \`$setup\`"
            echo "- Zip (unpack and run; no automatic updates): \`$zip\`"
            echo
            echo "SHA-256:"
            echo '```'
            awk -v a="$setup" -v b="$zip" '$2 == a || $2 == b' SHA256SUMS.txt
            echo '```'
            echo
            echo "All files: \`SHA256SUMS.txt\`. Built from $GITHUB_SHA (\`CharisViewer-$VERSION-build-record.txt\`)."
            echo "Provenance: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`"
          } > "$notes"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Charis Viewer $VERSION" --notes-file "$notes" -- *
          if ! tag_names_built; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "::error::the tag moved while the draft was made: the draft was deleted"
            exit 1
          fi

  test:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/release-package.yml
    with:
      publish: false
